name: daily benchmark snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run update
      - run: npm test
      - name: Commit snapshot if changed
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data methodology/cai-estimation-validation.md
          git commit -m "data: daily benchmark snapshot $(date -u +%F)"
          git push
