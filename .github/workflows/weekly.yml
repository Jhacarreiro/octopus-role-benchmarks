name: weekly benchmark snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Run benchmark refresh
        id: refresh
        continue-on-error: true
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/run-weekly-refresh.sh

      - name: Commit public refresh state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${{ steps.refresh.outputs.publish_snapshot }}" = "true" ]; then
            git add data site/data methodology/cai-estimation-validation.md
          else
            git add data/refresh-status.json site/data/refresh-status.json data/weekly-review.json site/data/weekly-review.json
          fi

          if git diff --cached --quiet; then
            echo "No public state changes"
            exit 0
          fi

          if [ "${{ steps.refresh.outputs.publish_snapshot }}" = "true" ]; then
            git commit -m "data: weekly benchmark snapshot $(date -u +%F)"
          else
            git commit -m "status: benchmark refresh failed $(date -u +%F)"
          fi
          git push

      - name: Fail workflow when refresh failed
        if: steps.refresh.outcome == 'failure'
        run: exit 1
